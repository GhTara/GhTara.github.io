<!doctype html>
<!-- Generated by build.py. Edit content/*.txt, then run python3 build.py. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="$theme_color">
    <meta name="description" content="$description">
    <title>$title · $name</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body$body_class>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html"$home_current>$name<span class="brand-dot" aria-hidden="true">.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
$navigation
        </nav>
      </div>
    </header>
    <main id="main" class="wrap" tabindex="-1">
$content
    </main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a class="contact-link" href="mailto:$email">$email</a>
        <nav class="footer-links" aria-label="Find me elsewhere">
          <a href="$github" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
          <a href="$scholar" target="_blank" rel="noopener noreferrer">Scholar ↗</a>
          <a href="$linkedin" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        </nav>
        <p class="copyright">© $copyright_year $name · $location</p>
      </div>
    </footer>
  </body>
</html>
